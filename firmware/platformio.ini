[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    fastled/FastLED@^3.6.0
    lovyan03/LovyanGFX@^1.1.16

; NOTAS:
; - NO usar TFT_eSPI: crashea con Guru Meditation en tft.init() sobre ESP32-S3.
; - La API LEDC de este core es la vieja: ledcSetup + ledcAttachPin + ledcWrite(canal, duty).
; - Tras cambiar este archivo, hacer Full Clean antes de compilar.
